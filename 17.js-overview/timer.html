<!DOCTYPE html>
<html lang="en">
<head>
      <meta charset="UTF-8">
      <meta http-equiv="X-UA-Compatible" content="IE=edge">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <link rel="stylesheet" href="timer.css">
      <title>Mi Cronometro</title>
</head>
<body>
      <div class="container">
            <div class="timer">
                  <h1>Vanila JS Timer :D</h1>
                   <div class="tablero">
                         <p id="digits">00:00:0</p>
                   </div>
                  <div class="buttons">
                         <button id="b_play">Play</button>
                         <button id="b_flag">Flag</button>
                         <button id="b_pause">Pause</button>
                         <button id="b_reset">Reset</button>
                  </div>
            </div>
            <div id="flags" class="flags">
                  <h2>Flags:</h2>
                  <ul id="flagList"></ul>
            </div>
      </div>
 <script src="timer.js"></script>
 <script src="test.js"></script>
</body>
</html>
